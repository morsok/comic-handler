services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "9999:9999"
    volumes:
      - ./backend:/app
      - backend_target:/app/target
      - ./backend/comics:/comics
      - ./backend/watch:/watch
      - ./backend/config:/config
    environment:
      - RUST_BACKTRACE=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  backend_target: # Persist cargo build cache
